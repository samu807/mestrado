# Parâmetros econômicos para a análise de viabilidade e do lance mínimo (valores reais de dez/2025).
# Cada item com três valores: [baixo, central, alto].
capex:
  pv_rs_kw: [3000, 4250, 5500]        # EPE/MME, Caderno de Parâmetros de Custos – PDE 2035 (nov/2025)
  # EPE/MME, Caderno de Parâmetros de Custos PDE 2035 (26/11/2025), em R$/kW de um sistema de
  # bess_duracao_referencia_h horas; convertido em parcelas de potência e de energia abaixo.
  bess_rs_kw: [5000, 5500, 6000]
  # IEA, Global Hydrogen Review 2025: sistemas fora da China US$ 1.900–2.500/kW; chineses US$ 500–1.100/kW.
  # Convertido pela PTAX de 09/12/2025 (R$ 5,4025/US$), sem tributos de importação.
  eletrolisador_usd_kw: [1100, 2000, 2500]
cambio_rs_usd: 5.4025
# Investimento no BESS com parcelas de potência e de energia: C = c_ref [(1 - f) P + f E / h_ref], com
# c_ref de capex.bess_rs_kw (R$/kW de um sistema de h_ref horas) e f a parcela que escala com a energia.
# O caderno do PDE 2035 não informa a duração de referência (as edições de 2030 e 2034 usavam 3 h);
# central: 4 h, a duração do produto do LRCAP; sensibilidade: 3 h. A bateria do modelo tem 5 h (300 MWh
# para 60 MW), de modo que a energia além da referência passa a ter custo.
bess_duracao_referencia_h: 4
bess_duracao_referencia_sensibilidade_h: 3
# Composição típica de um sistema de 4 h: bloco de baterias 35–55% do investimento, conversores e
# transformador 10–20%, conexão, obras e custos indiretos 25–40% (BESS-Market, 2026; Ember, 2025).
# Central: 60% escala com a energia (bloco de baterias e parte das obras e custos indiretos).
bess_fracao_energia: [0.45, 0.6, 0.75]
# O&M fixo anual, em fração do investimento.
# BESS: 2,5% do investimento em R$/kW, incluindo a reposição parcial de módulos (augmentation) que
# mantém a capacidade nominal durante os 15 anos, sem O&M variável (NREL, Annual Technology
# Baseline 2024, Utility-Scale Battery Storage). Por isso, na análise de investimento, o desgaste do
# módulo LRCAP não é cobrado por MWh (ver scripts/viabilidade.py). FV e eletrolisador: hipótese.
om_fixo_frac:
  pv: 0.015
  bess: 0.025
  eletrolisador: 0.03
# Taxa real de desconto. Central: WACC regulatório da geração ANTES de impostos (ANEEL, 2026),
# coerente com o fluxo de caixa antes de impostos. 8,0% (após impostos) só como sensibilidade:
# aplicada a um fluxo antes de impostos, ignora o imposto de renda e é otimista.
taxa_central: 0.1211
taxas_desconto: [0.1211, 0.08]
vida_anos: 15                          # prazo do contrato do LRCAP; sem valor residual (conservador)
# Uso da rede: TUST de geração, R$/kW·mês, ciclo 2026/2027 (ANEEL, jun/2026): média nacional
# (central) e faixa entre as regiões (baixo, alto). Pela regulação do armazenamento aprovada pela
# ANEEL em 02/06/2026, sistemas despachados pelo ONS pagam o uso da rede só na injeção. Cobrada sobre
# a potência da usina FV e a do BESS. Na rodada final, usar a TUST do barramento de conexão.
tust_geracao_rs_kw_mes: [5.68, 10.93, 19.49]
# Montante de uso (MUST) de injeção. Compartilhado: max(P_FV, P_BESS), com a FV limitada quando a
# bateria injeta (conexão compartilhada, Portaria MME 136/2026, art. 4º §1º, II; o MUST deve permitir a
# descarga e a recarga totais do SAE, art. 9º §13). Não compartilhado: P_FV + P_BESS.
must_compartilhado: true
# TUST de consumo (média nacional 2026/2027), usada só na sensibilidade de cobrança dupla (carga e
# injeção). A REN ANEEL 1.162/2026 prevê faturamento das duas parcelas para SAE colocalizado; fontes
# secundárias indicam isenção da parcela de consumo sob despacho centralizado do ONS. A confirmar.
tust_consumo_rs_kw_mes: 15.23
# Consumo auxiliar do BESS (climatização, controle), contínuo, em fração da potência nominal.
# Valor indicativo de fornecedor (0,8–1,6% da potência do conversor), a confirmar com catálogo.
# A parcela do módulo LRCAP medida no seu PMI entra na recarga; o que exceder a folga custeada
# pela CONCAP (injetada/RTE de referência) é pago ao PLD (Portaria MME 136/2026, art. 9º §§ 7º-8º).
consumo_auxiliar_frac: [0.0, 0.01, 0.02]
# Fração da receita fixa efetivamente recebida. A Portaria exige 100% de disponibilidade, e a
# indisponibilidade acordada com o ONS é isenta de penalidade; as penalidades dependem do edital.
disponibilidade: 1.0
disponibilidade_sensibilidade: 0.97
# Tributos sobre a receita bruta (PIS/Cofins), aplicados à receita fixa, à venda de energia no MCP e à
# venda de H2. A taxa antes de impostos cobre IR e CSLL, mas não os tributos sobre a receita. Central:
# regime cumulativo do lucro presumido (0,65% + 3%), admitido para receita bruta anual de até R$ 78 milhões
# (caso de uma SPE só do BESS); sensibilidade: regime não cumulativo do lucro real (1,65% + 7,6%), sem
# créditos. O preço do H2 é tomado líquido de ICMS. Encargos setoriais (TFSEE, contribuição à CCEE)
# não estão incluídos.
tributos_receita: 0.0365
tributos_receita_sensibilidade: 0.0925
# Reajuste anual da receita fixa pelo IPCA. Com true, a receita é constante em termos reais, coerente com o
# fluxo em valores reais. Com false, a receita é fixa em termos nominais e perde valor real à inflação
# ipca_anual. A CONFIRMAR na Portaria MME 136/2026 e no edital.
receita_fixa_reajuste_ipca: true
ipca_anual: 0.04
# Prazo de implantação [anos]: o investimento é desembolsado uniformemente nos anos anteriores à entrada
# em operação e capitalizado à taxa de desconto até essa data (juros durante a construção, JDC), com a
# convenção de meio de período: 1 ano equivale a (1 + i)^0,5. Supõe custos de referência sem JDC
# (overnight), a confirmar nos cadernos da EPE. Central: 1 ano; sensibilidade: 0 e 2 anos.
prazo_implantacao_anos: 1
prazo_implantacao_sensibilidade_anos: [0, 2]
# Armazenamento de H2 em vasos de aço a 160 bar, em US$/kg armazenado (DOE, metas técnicas de componentes
# de entrega de hidrogênio: US$ 1.000/kg em 2010 e meta de US$ 700/kg para 2020; a 430 bar, US$ 1.100/kg).
# Sem o compressor, cuja energia (~1 kWh/kg de 30 para 160 bar) não está no consumo específico.
tanque_h2_usd_kg: [700, 1000, 1100]
# Troca das pilhas do eletrolisador: 40% do investimento do sistema a cada 60.000 h equivalentes de
# operação na potência nominal (EPRI, 2022: 35-45% e 60-80 mil horas). Trocas após o último ano não contam.
pilha_troca_frac: 0.40
pilha_vida_h: 60000
# Reposição explícita de módulos do BESS (augmentation), só para avaliar o O&M de referência, que já a inclui
# (scripts/viabilidade.py, reposicao_modulos). Perda de capacidade por ciclagem: (1 - SOH de fim de vida) ao
# longo da vida em ciclos a 90% de profundidade (4.000 a 6.000 ciclos, faixa usada no custo de degradação);
# por calendário: fração fixa ao ano (hipótese). Preço: parcela do investimento que escala com a energia.
reposicao:
  soh_fim_vida: 0.80
  vida_ciclos: [4000, 5000, 6000]
  calendario_frac_ano: [0.005, 0.01, 0.02]
# Monte Carlo do lance mínimo (scripts/lance_monte_carlo.py): distribuições das premissas de custo e de regra,
# sorteadas de forma independente. Faixas iguais às da análise de sensibilidade; as probabilidades das
# premissas discretas (regras ainda não confirmadas) são hipóteses do autor.
monte_carlo:
  amostras: 5000
  semente: 2026
  bess_rs_kw: [triangular, 5000, 5500, 6000]
  duracao_referencia_3h_prob: 0.5            # EPE para 3 h (e não 4 h)
  fracao_energia: [uniforme, 0.45, 0.75]
  taxa: [triangular, 0.08, 0.1211, 0.14]
  om_bess: [uniforme, 0.015, 0.035]
  tust_rs_kw_mes: [triangular, 5.68, 10.93, 19.49]
  cobranca_dupla_prob: 0.5                   # TUST também na recarga (REN ANEEL 1.162/2026)
  consumo_auxiliar: [uniforme, 0.0, 0.02]
  sem_folga_concap_prob: 0.5                 # consumo auxiliar fora da recarga custeada pela CONCAP
  disponibilidade: [uniforme, 0.97, 1.0]
  pis_cofins_nao_cumulativo_prob: 0.25       # 9,25% em vez de 3,65%
  sem_reajuste_ipca_prob: 0.1
  implantacao_anos: {0: 0.25, 1: 0.5, 2: 0.25}
  dois_ciclos_dia_prob: 0.2                  # despacho de 2 ciclos/dia: reposição acima da de 1 ciclo/dia
  referencias_rs_mw_ano: [831000, 2334000]   # LRCAP 2026: térmicas existentes; térmicas e hidrelétricas
